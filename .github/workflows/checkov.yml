name: Checkov Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - dev
      - main

jobs:
  checkov:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov (CLI + SARIF)
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: projects/
          framework: terraform
          output_format: cli,sarif
          soft_fail: true
          skip_check: CKV_AWS_79

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Comment PR with Checkov summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `## 🔒 Checkov Security Scan Results

            ✅ Checkov scan completed.
            📊 View full results in **GitHub Security → Code scanning alerts**

            ---
            *Scan performed by Checkov on commit \`${context.sha}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Checkov Security Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
