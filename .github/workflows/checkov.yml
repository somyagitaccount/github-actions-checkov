name: Checkov PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checkov:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Run Checkov and capture output
        id: checkov
        continue-on-error: true
        run: |
          checkov -d projects/ \
            --framework terraform \
            --compact \
            > checkov.txt 2>&1 || true

          PASSED=$(grep -oP 'Passed checks: \K\d+' checkov.txt || echo 0)
          FAILED=$(grep -oP 'Failed checks: \K\d+' checkov.txt || echo 0)
          SKIPPED=$(grep -oP 'Skipped checks: \K\d+' checkov.txt || echo 0)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Comment PR with Checkov summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.checkov.outputs.passed }}';
            const failed = '${{ steps.checkov.outputs.failed }}';
            const skipped = '${{ steps.checkov.outputs.skipped }}';

            let body = `## 🔍 Checkov Terraform Scan Results

            ✅ **Passed:** ${passed}
            ❌ **Failed:** ${failed}
            ⏭️ **Skipped:** ${skipped}
            `;

            if (failed !== '0') {
              body += `\n⚠️ **Security issues detected. Please fix before merge.**`;
            } else {
              body += `\n🎉 **No security issues found.**`;
            }

            body += `\n\n---\n*Scan run on commit \`${context.sha}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Checkov Terraform Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
