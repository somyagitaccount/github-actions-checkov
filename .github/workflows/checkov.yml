name: Checkov PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checkov:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov jq

      # -------------------------------------------------
      # 1. Run Checkov (JSON output for annotations)
      # -------------------------------------------------
      - name: Run Checkov (JSON)
        id: checkov
        continue-on-error: true
        run: |
          checkov -d projects/ \
            --framework terraform \
            --output json \
            --compact \
            > checkov.json || true

          PASSED=$(jq '[.results.passed_checks[]] | length' checkov.json)
          FAILED=$(jq '[.results.failed_checks[]] | length' checkov.json)
          SKIPPED=$(jq '[.results.skipped_checks[]] | length' checkov.json)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 2. Create inline PR annotations
      # -------------------------------------------------
      - name: Create PR annotations
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('checkov.json', 'utf8'));

            const annotations = report.results.failed_checks.map(f => ({
              path: f.file_path.replace(/^\//, ''),
              start_line: f.file_line_range?.[0] || 1,
              end_line: f.file_line_range?.[1] || 1,
              annotation_level: 'failure',
              message: `${f.check_id}: ${f.check_name}`
            }));

            if (annotations.length > 0) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Checkov Terraform Findings',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Checkov Terraform Scan',
                  summary: `${annotations.length} security issues detected`,
                  annotations: annotations.slice(0, 50) // GitHub limit
                }
              });
            }

      # -------------------------------------------------
      # 3. PR Comment (summary + failed rules list)
      # -------------------------------------------------
      - name: Comment PR with Checkov summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('checkov.json', 'utf8'));

            const passed = '${{ steps.checkov.outputs.passed }}';
            const failed = '${{ steps.checkov.outputs.failed }}';
            const skipped = '${{ steps.checkov.outputs.skipped }}';

            let body = `## 🔍 Checkov Terraform Scan Results

            ✅ **Passed:** ${passed}
            ❌ **Failed:** ${failed}
            ⏭️ **Skipped:** ${skipped}
            `;

            if (failed !== '0') {
              body += `\n\n⚠️ **Security issues detected. Please fix before merge.**\n`;
            } else {
              body += `\n\n🎉 **No security issues found.**\n`;
            }

            if (report.results.failed_checks.length > 0) {
              body += `\n<details>\n<summary>❌ Failed checks</summary>\n\n`;
              report.results.failed_checks.slice(0, 20).forEach(f => {
                body += `- **${f.check_id}** – ${f.check_name}\n  \`${f.file_path}:${f.file_line_range?.[0] || ''}\`\n`;
              });
              body += `\n</details>`;
            }

            body += `\n\n---\n*Scan run on commit \`${context.sha}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Checkov Terraform Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
