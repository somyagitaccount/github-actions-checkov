name: Checkov Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - dev
      - main

jobs:
  checkov:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov (CLI + SARIF)
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: projects/
          framework: terraform
          output_format: cli,sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          skip_check: CKV_AWS_79

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

      - name: Comment PR with Checkov summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const output = fs.readFileSync('checkov-results.sarif', 'utf8');
            const sarif = JSON.parse(output);

            let passed = 0;
            let failed = 0;

            for (const run of sarif.runs || []) {
              for (const result of run.results || []) {
                if (result.level === 'error') failed++;
                else passed++;
              }
            }

            let body = `## 🔒 Checkov Security Scan Results

            ✅ **Passed checks:** ${passed}
            ❌ **Failed checks:** ${failed}

            ${failed > 0
              ? '⚠️ **Security issues detected. Please review before merging.**'
              : '✅ **No security issues found.**'}

            ---
            *Scan performed by Checkov on commit \`${context.sha}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Checkov Security Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
