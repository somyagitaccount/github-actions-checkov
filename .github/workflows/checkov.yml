name: Checkov Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - dev
      - main

jobs:
  checkov:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: projects/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          download_external_modules: true
          skip_check: |
            CKV_AWS_79  # Skip EKS endpoint public access check if not applicable
          quiet: false

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

      - name: Run Checkov for PR comment
        id: checkov-pr
        continue-on-error: true
        run: |
          pip install checkov
          checkov -d projects/ \
            --framework terraform \
            --output cli \
            --compact \
            --download-external-modules \
            > checkov-output.txt 2>&1 || true
          
          # Capture exit code
          CHECKOV_EXIT_CODE=$?
          echo "exit_code=$CHECKOV_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Count checks
          PASSED=$(grep -oP 'Passed checks: \K\d+' checkov-output.txt || echo "0")
          FAILED=$(grep -oP 'Failed checks: \K\d+' checkov-output.txt || echo "0")
          SKIPPED=$(grep -oP 'Skipped checks: \K\d+' checkov-output.txt || echo "0")
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Comment PR with Checkov results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            let checkovOutput = '';
            try {
              checkovOutput = fs.readFileSync('checkov-output.txt', 'utf8');
            } catch (error) {
              checkovOutput = 'Unable to read Checkov output file.';
            }
            
            const passed = '${{ steps.checkov-pr.outputs.passed }}';
            const failed = '${{ steps.checkov-pr.outputs.failed }}';
            const skipped = '${{ steps.checkov-pr.outputs.skipped }}';
            const exitCode = '${{ steps.checkov-pr.outputs.exit_code }}';
            
            // Build summary
            let summary = '## 🔒 Checkov Security Scan Results\n\n';
            summary += `✅ **Passed checks:** ${passed || '0'}\n`;
            summary += `❌ **Failed checks:** ${failed || '0'}\n`;
            if (skipped && skipped !== '0') {
              summary += `⏭️ **Skipped checks:** ${skipped}\n`;
            }
            summary += '\n';
            
            // Add status message
            if (failed && failed !== '0') {
              summary += `⚠️ **Security issues detected!** Please review the findings below.\n\n`;
            } else {
              summary += `✅ **No security issues found!**\n\n`;
            }
            
            // Add full output in collapsed section
            summary += `<details>\n<summary>View full Checkov output</summary>\n\n\`\`\`\n${checkovOutput}\n\`\`\`\n\n</details>\n\n`;
            summary += `---\n*This scan was performed by [Checkov](https://www.checkov.io/) on commit ${{ github.sha }}*\n`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Checkov Security Scan Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }

